       naranja y el pin blanco con el hueco en navy (se recorta con
       evenodd, así el fondo se ve a través). -->
  <rect width="400" height="400" fill="#0A2168"/>
  <g transform="translate(5.2,-79.8) scale(0.95)">
  <g transform="translate(148,318) rotate(-34) scale(10.2) translate(-12,-11.2)">
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="none" stroke="#EE7420" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(148,316) scale(5.9) translate(-12,-11.2)">
    <path fill-rule="evenodd" fill="#FFFFFF" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
  </g>
  <path d="M124 192 L124 154 Q124 130 148 130 L212 130
