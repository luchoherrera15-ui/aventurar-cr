<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookea · Acceso animado</title>
  <meta name="description" content="Mockup animado de la pantalla de acceso de Bookea.">
  <style>
    :root {
      --navy-950: #081c35;
      --navy-900: #0b2341;
      --navy-800: #12335d;
      --blue-700: #1f4b82;
      --blue-500: #2d73c7;
      --orange-500: #f28c28;
      --orange-400: #ff9f3f;
      --paper: #f7f9fb;
      --white: #ffffff;
      --line: #dce5ee;
      --muted: #6f7b8b;
      --shadow: 0 22px 70px rgba(8, 28, 53, 0.13), 0 3px 12px rgba(8, 28, 53, 0.05);
      --ease-out: cubic-bezier(.2, .75, .2, 1);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--navy-950);
      background: var(--paper);
      font-family: Inter, Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, input { font: inherit; }
    a { color: inherit; }

    .site-header {
      position: relative;
      z-index: 100;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(24px, 6vw, 118px);
      background: rgba(255, 255, 255, 0.93);
      border-bottom: 1px solid rgba(8, 28, 53, 0.09);
      backdrop-filter: blur(18px);
    }

    .brand-wrap,
    .header-actions,
    .avatar-menu {
      display: flex;
      align-items: center;
    }

    .brand-wrap { gap: 13px; }

    .brand {
      position: relative;
      font-size: clamp(29px, 2.6vw, 39px);
      line-height: 1;
      font-weight: 850;
      letter-spacing: -2.1px;
      color: var(--navy-900);
      text-decoration: none;
    }

    .brand::after {
      content: "›";
      position: absolute;
      right: 1px;
      bottom: -9px;
      color: var(--orange-500);
      font-size: 17px;
      font-weight: 900;
      transform: rotate(40deg);
    }

    .brand-separator {
      height: 23px;
      width: 1px;
      background: #d8dfe6;
      transform: rotate(13deg);
    }

    .page-name {
      color: #707987;
      font-size: 13px;
      white-space: nowrap;
    }

    .header-actions { gap: 23px; }

    .publish-link {
      font-size: 13px;
      font-weight: 720;
      text-decoration: none;
      transition: color .2s ease;
    }

    .publish-link:hover { color: var(--orange-500); }

    .avatar-menu {
      height: 42px;
      gap: 9px;
      padding: 5px 7px 5px 12px;
      border: 1px solid #d9e0e7;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 3px 9px rgba(8, 28, 53, 0.08);
      cursor: pointer;
    }

    .menu-lines,
    .menu-lines::before,
    .menu-lines::after {
      width: 13px;
      height: 1.5px;
      display: block;
      border-radius: 99px;
      background: var(--navy-900);
    }

    .menu-lines { position: relative; }
    .menu-lines::before,
    .menu-lines::after { content: ""; position: absolute; left: 0; }
    .menu-lines::before { top: -4px; }
    .menu-lines::after { top: 4px; }

    .avatar {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #eef2f6;
      color: #a4acb8;
    }

    .page {
      position: relative;
      isolation: isolate;
      min-height: calc(100svh - 76px);
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 116px 24px 54px;
      background:
        radial-gradient(circle at 50% 43%, rgba(255,255,255,.99) 0 16%, rgba(247,249,251,.87) 35%, rgba(247,249,251,.97) 74%),
        linear-gradient(180deg, #fbfcfd 0%, #f4f7fa 100%);
    }

    .map-grid {
      position: absolute;
      inset: 0;
      z-index: -5;
      opacity: .72;
      background-image:
        linear-gradient(31deg, transparent 0 46%, rgba(36, 82, 127, .055) 46.15% 46.35%, transparent 46.5%),
        linear-gradient(116deg, transparent 0 56%, rgba(36, 82, 127, .045) 56.1% 56.3%, transparent 56.45%),
        linear-gradient(8deg, transparent 0 72%, rgba(36, 82, 127, .04) 72.1% 72.3%, transparent 72.45%);
      background-size: 310px 250px, 390px 320px, 480px 390px;
      mask-image: linear-gradient(to bottom, transparent 0, #000 9%, #000 89%, transparent 100%);
    }

    .routes {
      position: absolute;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .route {
      fill: none;
      stroke: rgba(45, 115, 199, .38);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 2 7;
      animation: routeFlow 16s linear infinite;
    }

    .route.route-soft {
      stroke: rgba(18, 51, 93, .12);
      stroke-dasharray: none;
      stroke-width: 1;
    }

    .route-glow {
      fill: none;
      stroke: url(#routeGradient);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 38 850;
      filter: url(#softGlow);
      animation: lightTravel 11s linear infinite;
    }

    @keyframes routeFlow { to { stroke-dashoffset: -90; } }
    @keyframes lightTravel { to { stroke-dashoffset: -888; } }

    .ambient-title {
      position: absolute;
      z-index: -1;
      top: clamp(28px, 5vh, 56px);
      left: 50%;
      width: min(90%, 760px);
      margin: 0;
      transform: translateX(-50%);
      text-align: center;
      font-size: clamp(22px, 2.2vw, 35px);
      line-height: 1.15;
      letter-spacing: -1.2px;
      color: rgba(11, 35, 65, .17);
      font-weight: 790;
    }

    .ambient-title strong {
      color: var(--navy-900);
      font-weight: 850;
    }

    .ambient-title i {
      color: var(--orange-500);
      font-style: normal;
    }

    .login-card {
      position: relative;
      z-index: 30;
      width: min(100%, 424px);
      padding: 43px 42px 31px;
      border: 1px solid rgba(8, 28, 53, .09);
      border-radius: 22px;
      background: rgba(255, 255, 255, .965);
      box-shadow: var(--shadow);
      backdrop-filter: blur(15px);
    }

    .login-card::before {
      content: "";
      position: absolute;
      left: -1px;
      right: -1px;
      top: -1px;
      height: 6px;
      border-radius: 22px 22px 0 0;
      background: linear-gradient(90deg, var(--navy-900) 0 74%, var(--orange-500) 74% 100%);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--blue-500);
      font-size: 11px;
      line-height: 1;
      letter-spacing: .08em;
      font-weight: 850;
    }

    h1 {
      margin: 0 0 9px;
      color: var(--navy-900);
      font-size: 29px;
      line-height: 1.12;
      letter-spacing: -.9px;
    }

    .intro {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.55;
    }

    .field-label {
      display: block;
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 760;
    }

    .email-input {
      width: 100%;
      height: 49px;
      padding: 0 15px;
      color: var(--navy-900);
      background: #fbfcfd;
      border: 1px solid #d5dde6;
      border-radius: 11px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .email-input::placeholder { color: #9aa5b2; }
    .email-input:focus {
      border-color: var(--blue-500);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(45, 115, 199, .12);
    }

    .primary-btn {
      position: relative;
      width: 100%;
      height: 49px;
      margin-top: 16px;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(115deg, var(--navy-900), #173c78);
      border: 0;
      border-radius: 11px;
      font-weight: 770;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(23, 60, 120, .2);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .primary-btn::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -45%;
      width: 35%;
      transform: skewX(-22deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
      transition: left .55s ease;
    }

    .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 11px 28px rgba(23, 60, 120, .25); }
    .primary-btn:hover::after { left: 120%; }
    .primary-btn:active { transform: translateY(1px); }

    .security {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 13px 0 0;
      color: #929ca9;
      font-size: 11.5px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0 17px;
      color: #858f9c;
      font-size: 11px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e1e6ec;
    }

    .social-stack { display: grid; gap: 10px; }

    .social-btn {
      width: 100%;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--navy-950);
      background: #fff;
      border: 1px solid #d8dfe6;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 720;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .social-btn:hover {
      background: #f7f9fb;
      border-color: #bfcad5;
      transform: translateY(-1px);
    }

    .google-g { font-weight: 900; color: #4285f4; font-size: 18px; }
    .facebook-f {
      width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      color: #fff;
      background: #1877f2;
      border-radius: 50%;
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: 14px;
    }

    .provider-copy {
      margin: 22px 0 0;
      padding-top: 19px;
      color: #8b95a2;
      border-top: 1px solid #e5e9ed;
      text-align: center;
      font-size: 11.5px;
    }

    .provider-copy a {
      color: var(--navy-800);
      font-weight: 760;
      text-underline-offset: 2px;
    }

    .target {
      --target-x: 50%;
      --target-y: 50%;
      position: absolute;
      z-index: 8;
      left: var(--target-x);
      top: var(--target-y);
      width: 18px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      opacity: 0;
      transform: translate(-50%, -50%) scale(.55);
      pointer-events: none;
      transition: opacity .55s ease, transform .7s var(--ease-out), filter .3s ease;
    }

    .target.is-visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .target:hover,
    .target:focus-visible { z-index: 45; filter: drop-shadow(0 8px 20px rgba(242, 140, 40, .2)); }
    .target:focus-visible { outline: 3px solid rgba(45, 115, 199, .24); outline-offset: 15px; }

    .target-core {
      position: absolute;
      inset: 3px;
      z-index: 4;
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--orange-500);
      box-shadow: 0 2px 8px rgba(242, 140, 40, .34);
      animation: coreBreathe 2.4s ease-in-out infinite;
    }

    .pulse-ring {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      width: 17px;
      height: 17px;
      border: 1.5px solid rgba(242, 140, 40, .62);
      border-radius: 50%;
      opacity: 0;
      transform: translate(-50%, -50%) scale(.65);
      animation: radarPulse 2.8s var(--ease-out) infinite;
    }

    .pulse-ring.r2 { animation-delay: .9s; }
    .pulse-ring.r3 { animation-delay: 1.8s; }

    @keyframes radarPulse {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.65); }
      12% { opacity: .82; }
      74%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(3.25); }
    }

    @keyframes coreBreathe {
      0%, 100% { transform: scale(.92); }
      50% { transform: scale(1.13); }
    }

    .offer-bubble {
      position: absolute;
      z-index: 12;
      width: max-content;
      min-width: 205px;
      max-width: 245px;
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 11px;
      align-items: center;
      padding: 12px 15px 12px 12px;
      color: var(--navy-900);
      background: rgba(255,255,255,.97);
      border: 1px solid rgba(8, 28, 53, .08);
      border-radius: 15px;
      box-shadow: 0 12px 32px rgba(8, 28, 53, .13);
      opacity: 0;
      transform: translateY(12px) scale(.96);
      transform-origin: 50% 100%;
      transition: opacity .42s ease .14s, transform .58s var(--ease-out) .12s;
      pointer-events: none;
    }

    .target.is-visible .offer-bubble {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .bubble-top .offer-bubble { left: 50%; bottom: 38px; translate: -50% 0; }
    .bubble-right .offer-bubble { left: 38px; top: 50%; translate: 0 -50%; }
    .bubble-left .offer-bubble { right: 38px; top: 50%; translate: 0 -50%; }
    .bubble-bottom .offer-bubble { left: 50%; top: 38px; translate: -50% 0; }

    .bubble-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: var(--navy-800);
      background: #f2f6fa;
      border-radius: 11px;
      font-size: 18px;
    }

    .business-name {
      display: block;
      margin-bottom: 2px;
      font-size: 13px;
      line-height: 1.25;
      font-weight: 820;
    }

    .offer {
      display: block;
      color: var(--orange-500);
      font-size: 11.5px;
      line-height: 1.3;
      font-weight: 790;
    }

    .target.is-entering .offer-bubble { animation: softFloat 3.8s ease-in-out .7s infinite; }

    @keyframes softFloat {
      0%, 100% { margin-top: 0; }
      50% { margin-top: -6px; }
    }

    .demo-note {
      position: absolute;
      right: 18px;
      bottom: 14px;
      z-index: 50;
      color: rgba(8, 28, 53, .36);
      font-size: 10px;
      letter-spacing: .03em;
      user-select: none;
    }

    .toast {
      position: fixed;
      z-index: 200;
      left: 50%;
      bottom: 28px;
      padding: 11px 16px;
      color: #fff;
      background: var(--navy-900);
      border-radius: 999px;
      box-shadow: 0 12px 35px rgba(8, 28, 53, .24);
      font-size: 12.5px;
      font-weight: 700;
      opacity: 0;
      transform: translate(-50%, 18px);
      transition: opacity .3s ease, transform .35s var(--ease-out);
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1050px) {
      .target:nth-of-type(n+7) { display: none; }
      .login-card { width: min(100%, 408px); }
      .ambient-title { top: 35px; }
    }

    @media (max-width: 760px) {
      .site-header { height: 68px; padding: 0 18px; }
      .page { min-height: calc(100svh - 68px); padding: 103px 16px 40px; }
      .page-name, .publish-link { display: none; }
      .brand-separator { display: none; }
      .brand { font-size: 31px; }
      .ambient-title { top: 25px; font-size: 21px; }
      .login-card { padding: 38px 24px 25px; border-radius: 19px; }
      .target { transform: translate(-50%, -50%) scale(.45); }
      .target.is-visible { transform: translate(-50%, -50%) scale(.82); }
      .target:nth-of-type(n+5) { display: none; }
      .target.mobile-hide { display: none; }
      .offer-bubble { display: none; }
      .bubble-icon { width: 34px; height: 34px; }
      .business-name { font-size: 12px; }
      .offer { font-size: 10.5px; }
      .demo-note { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
      .target:nth-of-type(-n+4) { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      .target:nth-of-type(-n+4) .offer-bubble { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand-wrap">
      <a class="brand" href="#" aria-label="Bookea, inicio">Bookea</a>
      <span class="brand-separator" aria-hidden="true"></span>
      <span class="page-name">Tu cuenta</span>
    </div>

    <div class="header-actions">
      <a class="publish-link" href="#">Publicá tu espacio</a>
      <button class="avatar-menu" type="button" aria-label="Abrir menú">
        <span class="menu-lines" aria-hidden="true"></span>
        <span class="avatar" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5.33 0-8 2.67-8 5v1h16v-1c0-2.33-2.67-5-8-5Z"/>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <main class="page">
    <div class="map-grid" aria-hidden="true"></div>

    <svg class="routes" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="routeGradient" x1="0" x2="1">
          <stop offset="0" stop-color="#2d73c7" stop-opacity="0"/>
          <stop offset=".55" stop-color="#2d73c7" stop-opacity=".9"/>
          <stop offset="1" stop-color="#f28c28" stop-opacity="0"/>
        </linearGradient>
        <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path class="route route-soft" d="M-60 660 C180 490 370 780 610 610 S1030 370 1240 565 S1470 700 1690 510"/>
      <path class="route" d="M-80 525 C150 270 350 560 565 405 S950 230 1140 420 S1450 650 1660 330"/>
      <path class="route-glow" d="M-80 525 C150 270 350 560 565 405 S950 230 1140 420 S1450 650 1660 330"/>
      <path class="route" d="M85 845 C215 690 385 760 525 855 M1020 840 C1140 670 1350 745 1570 620"/>
    </svg>

    <p class="ambient-title" aria-hidden="true">Todo lo que buscás, <strong>más cerca<i>.</i></strong></p>

    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">TU CUENTA BOOKEA</p>
      <h1 id="login-title">Entrá a Bookea</h1>
      <p class="intro">Tus reservas, favoritos y beneficios en un solo lugar.</p>

      <form id="login-form">
        <label class="field-label" for="email">Correo electrónico</label>
        <input class="email-input" id="email" name="email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
        <button class="primary-btn" type="submit"><span>Enviar código</span></button>
      </form>

      <p class="security">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
        Acceso seguro · Sin contraseñas
      </p>

      <div class="divider">o continuá con</div>

      <div class="social-stack">
        <button class="social-btn" type="button"><span class="google-g">G</span>Google</button>
        <button class="social-btn" type="button"><span class="facebook-f">f</span>Facebook</button>
      </div>

      <p class="provider-copy">¿Tenés un negocio? <a href="#">Entrá como proveedor</a></p>
    </section>

    <button class="target bubble-right" style="--target-x: 13%; --target-y: 24%;" type="button" aria-label="Pura Matcha: 20% OFF">
      <span class="pulse-ring r1"></span><span class="pulse-ring r2"></span><span class="pulse-ring r3"></span><span class="target-core"></span>
      <span class="offer-bubble"><span class="bubble-icon">♧</span><span><span class="business-name">Pura Matcha</span><span class="offer">20% OFF</span></span></span>
    </button>

    <button class="target bubble-left" style="--target-x: 86%; --target-y: 25%;" type="button" aria-label="Barbería El Silencio: 15% OFF">
      <span class="pulse-ring r1"></span><span class="pulse-ring r2"></span><span class="pulse-ring r3"></span><span class="target-core"></span>
      <span class="offer-bubble"><span class="bubble-icon">✂</span><span><span class="business-name">Barbería El Silencio</span><span class="offer">15% OFF</span></span></span>
    </button>

    <button class="target bubble-right" style="--target-x: 10%; --target-y: 70%;" type="button" aria-label="Aura Spa: cita disponible hoy">
      <span class="pulse-ring r1"></span><span class="pulse-ring r2"></span><span class="pulse-ring r3"></span><span class="target-core"></span>
      <span class="offer-bubble"><span class="bubble-icon">✦</span><span><span class="business-name">Aura Spa</span><span class="offer">Cita disponible hoy</span></span></span>
    </button>

    <button class="target bubble-left" style="--target-x: 88%; --target-y: 67%;" type="button" aria-label="Terraza Nómada: evento este fin de semana">
      <span class="pulse-ring r1"></span><span class="pulse-ring r2"></span><span class="pulse-ring r3"></span><span class="target-core"></span>
      <span class="offer-bubble"><span class="bubble-icon">▣</span><span><span class="business-name">Terraza Nómada</span><span class="offer">Evento este fin de semana</span></span></span>
    </button>

  <div class="toast" id="toast" role="status" aria-live="polite">Código enviado ✓</div>

  <script>
    (() => {
      const targets = [...document.querySelectorAll('.target')];
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const visibleQueue = [];
      let nextIndex = 0;
      let cycleTimer;

      function currentlyAvailable() {
        return targets.filter((target) => getComputedStyle(target).display !== 'none');
      }

      function showNext() {
        const available = currentlyAvailable();
        if (!available.length) return;

        const maxVisible = window.innerWidth <= 760 ? 2 : 4;
        const target = available[nextIndex % available.length];
        nextIndex += 1;

        if (!target.classList.contains('is-visible')) {
          target.classList.add('is-visible', 'is-entering');
          visibleQueue.push(target);
          window.setTimeout(() => target.classList.remove('is-entering'), 900);
        }

        while (visibleQueue.length > maxVisible) {
          const oldest = visibleQueue.shift();
          if (oldest && !oldest.matches(':hover, :focus-visible')) oldest.classList.remove('is-visible');
        }
      }

      function startCycle() {
        window.clearInterval(cycleTimer);
        targets.forEach((target) => target.classList.remove('is-visible', 'is-entering'));
        visibleQueue.length = 0;
        nextIndex = 0;

        if (reduceMotion.matches) {
          currentlyAvailable().slice(0, window.innerWidth <= 760 ? 2 : 4).forEach((target) => target.classList.add('is-visible'));
          return;
        }

        showNext();
        window.setTimeout(showNext, 520);
        window.setTimeout(showNext, 1100);
        cycleTimer = window.setInterval(showNext, 1750);
      }

      targets.forEach((target) => {
        target.addEventListener('mouseenter', () => target.classList.add('is-visible'));
        target.addEventListener('focus', () => target.classList.add('is-visible'));
      });

      const form = document.querySelector('#login-form');
      const toast = document.querySelector('#toast');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        const buttonText = form.querySelector('.primary-btn span');
        buttonText.textContent = 'Código enviado ✓';
        toast.classList.add('show');
        window.setTimeout(() => {
          toast.classList.remove('show');
          buttonText.textContent = 'Enviar código';
        }, 2300);
      });

      let resizeTimer;
      window.addEventListener('resize', () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(startCycle, 180);
      });

      reduceMotion.addEventListener?.('change', startCycle);
      startCycle();
    })();
  </script>
